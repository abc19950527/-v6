name: Build All Platforms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================
  # Android APK 构建
  # ============================================
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36
          pip install buildozer==1.5.0
          pip install kivy==2.3.0

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-dev build-essential git zip unzip openjdk-11-jdk
          # 设置 Java 11 为默认版本
          sudo update-alternatives --set java /usr/lib/jvm/java-11-openjdk-amd64/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-11-openjdk-amd64/bin/javac
          java -version

      - name: Setup buildozer SDK directory
        run: |
          SYSTEM_SDK="/usr/local/lib/android/sdk"
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          
          echo "=== 系统SDK目录 ==="
          ls -la "$SYSTEM_SDK/"
          ls -la "$SYSTEM_SDK/cmdline-tools/" 2>/dev/null || echo "无cmdline-tools"
          
          # 创建buildozer SDK目录
          mkdir -p "$BUILDOZER_SDK"
          
          # 复制系统SDK内容到buildozer目录
          rsync -a "$SYSTEM_SDK/" "$BUILDOZER_SDK/" --exclude='cmdline-tools' --exclude='tools'
          
          # 创建buildozer期望的tools/bin/sdkmanager结构
          mkdir -p "$BUILDOZER_SDK/tools/bin"
          
          # 查找cmdline-tools
          if [ -d "$SYSTEM_SDK/cmdline-tools/latest" ]; then
            CMDLINE_BIN="$SYSTEM_SDK/cmdline-tools/latest/bin"
          elif [ -d "$SYSTEM_SDK/cmdline-tools/16.0" ]; then
            CMDLINE_BIN="$SYSTEM_SDK/cmdline-tools/16.0/bin"
          else
            echo "查找cmdline-tools:"
            find "$SYSTEM_SDK" -name 'sdkmanager' -type f 2>/dev/null | head -5
            CMDLINE_BIN=""
          fi
          
          if [ -n "$CMDLINE_BIN" ] && [ -f "$CMDLINE_BIN/sdkmanager" ]; then
            echo "复制sdkmanager从: $CMDLINE_BIN"
            # 查看sdkmanager脚本结构
            head -20 "$CMDLINE_BIN/sdkmanager"
            
            # 复制整个cmdline-tools目录结构
            cp -r "$CMDLINE_BIN/sdkmanager" "$BUILDOZER_SDK/tools/bin/"
            chmod +x "$BUILDOZER_SDK/tools/bin/sdkmanager"
            cp "$CMDLINE_BIN/sdkmanager.bat" "$BUILDOZER_SDK/tools/bin/" 2>/dev/null || true
            
            # 查看lib目录结构
            echo "=== cmdline-tools lib ==="
            ls -la "$CMDLINE_BIN/lib/" 2>/dev/null | head -20
            
            # 复制lib目录
            if [ -d "$CMDLINE_BIN/lib" ]; then
              rm -rf "$BUILDOZER_SDK/tools/bin/lib"
              cp -r "$CMDLINE_BIN/lib" "$BUILDOZER_SDK/tools/bin/"
            fi
            
            # 测试sdkmanager
            echo "=== 测试sdkmanager ==="
            "$BUILDOZER_SDK/tools/bin/sdkmanager" --version 2>&1 || echo "sdkmanager测试失败"
          fi
          
          # 确保许可证存在
          mkdir -p "$BUILDOZER_SDK/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$BUILDOZER_SDK/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$BUILDOZER_SDK/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$BUILDOZER_SDK/licenses/android-sdk-license"
          echo "e6b7c2ab7fa2298c15165e9583d0acf0b04a2232" >> "$BUILDOZER_SDK/licenses/google-gdk-license"
          touch "$BUILDOZER_SDK/licenses/android-sdk-preview-license"
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          echo "=== buildozer SDK结构 ==="
          ls -la "$BUILDOZER_SDK/"
          echo "=== tools/bin ==="
          ls -la "$BUILDOZER_SDK/tools/bin/" 2>/dev/null || echo "不存在"

      - name: Build debug APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROIDSDKROOT=$HOME/.buildozer/android/platform/android-sdk
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          cd android
          buildozer android debug
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDSDKROOT: /home/runner/.buildozer/android/platform/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
          BUILD_NUMBER: ${{ github.run_number }}

      - name: List APK output
        run: |
          ls -la android/bin/ 2>/dev/null || echo "APK目录不存在"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/bin/*.apk
          retention-days: 30

  # ============================================
  # Windows EXE 构建
  # ============================================
  build-desktop:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd desktop
          npm install

      - name: Build Electron app
        run: |
          cd desktop
          npm run build
        shell: bash

      - name: List build output
        run: |
          if (Test-Path desktop/release) { Get-ChildItem desktop/release -Recurse } else { Write-Host "Release目录不存在" }
          if (Test-Path desktop/dist) { Get-ChildItem desktop/dist -Recurse } else { Write-Host "Dist目录不存在" }

      - name: Upload desktop installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-app
          path: |
            desktop/release/*.exe
            desktop/dist/**/*
          retention-days: 30
