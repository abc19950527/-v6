name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libsqlite3-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33
          pip install buildozer

      - name: Build debug APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROIDSDKROOT=/usr/local/lib/android/sdk
          export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.5
          export PATH=$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          
          # 清理 buildozer 缓存
          rm -rf ~/.buildozer
          rm -rf ~/.android
          
          # 接受 Android SDK licenses
          mkdir -p ~/.android
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/repositories.cfg
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          cd android
          
          # 首次运行 buildozer 让它下载 SDK
          buildozer android debug || true
          
          # buildozer 下载 SDK 后，再次接受许可证
          if [ -d ~/.buildozer/android/platform/android-sdk ]; then
            mkdir -p ~/.buildozer/android/platform/android-sdk/.android
            cp ~/.android/repositories.cfg ~/.buildozer/android/platform/android-sdk/.android/
            if [ -f ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ]; then
              yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=~/.buildozer/android/platform/android-sdk --licenses > /dev/null 2>&1 || true
            fi
          fi
          
          # 再次运行 buildozer
          buildozer android debug
