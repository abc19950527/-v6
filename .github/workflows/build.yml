name: Build All Platforms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================
  # Android APK 构建
  # ============================================
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36
          pip install buildozer==1.5.0
          pip install kivy==2.3.0

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-dev build-essential git zip unzip openjdk-11-jdk
          sudo update-alternatives --set java /usr/lib/jvm/java-11-openjdk-amd64/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-11-openjdk-amd64/bin/javac
          java -version

      - name: Setup buildozer SDK structure
        run: |
          SYSTEM_SDK="/usr/local/lib/android/sdk"
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          
          echo "=== 创建buildozer SDK目录结构 ==="
          mkdir -p "$BUILDOZER_SDK"
          
          # 复制系统SDK的主要内容
          for dir in build-tools platforms platform-tools ndk licenses; do
            if [ -d "$SYSTEM_SDK/$dir" ]; then
              cp -r "$SYSTEM_SDK/$dir" "$BUILDOZER_SDK/"
              echo "复制: $dir"
            fi
          done
          
          # 创建buildozer期望的tools/bin结构
          mkdir -p "$BUILDOZER_SDK/tools/bin"
          
          # 从系统cmdline-tools复制sdkmanager到tools/bin
          CMDLINE_BIN=""
          for ver in latest 16.0 15.0 14.0; do
            if [ -f "$SYSTEM_SDK/cmdline-tools/$ver/bin/sdkmanager" ]; then
              CMDLINE_BIN="$SYSTEM_SDK/cmdline-tools/$ver/bin"
              break
            fi
          done
          
          if [ -n "$CMDLINE_BIN" ]; then
            echo "使用cmdline-tools: $CMDLINE_BIN"
            
            # 复制sdkmanager
            cp "$CMDLINE_BIN/sdkmanager" "$BUILDOZER_SDK/tools/bin/"
            chmod +x "$BUILDOZER_SDK/tools/bin/sdkmanager"
            
            # 复制bat文件
            cp "$CMDLINE_BIN/sdkmanager.bat" "$BUILDOZER_SDK/tools/bin/" 2>/dev/null || true
            
            # 复制lib目录（JAR文件）
            if [ -d "$CMDLINE_BIN/lib" ]; then
              cp -r "$CMDLINE_BIN/lib" "$BUILDOZER_SDK/tools/bin/"
              echo "复制lib目录"
            fi
            
            # 复制source.properties
            if [ -f "$CMDLINE_BIN/source.properties" ]; then
              cp "$CMDLINE_BIN/source.properties" "$BUILDOZER_SDK/tools/bin/"
            fi
          else
            echo "警告: 未找到cmdline-tools sdkmanager"
            find "$SYSTEM_SDK" -name 'sdkmanager' -type f 2>/dev/null | head -5
          fi
          
          # 创建许可证文件
          mkdir -p "$BUILDOZER_SDK/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$BUILDOZER_SDK/licenses/android-sdk-license"
          echo "e6b7c2ab7fa2298c15165e9583d0acf0b04a2232" > "$BUILDOZER_SDK/licenses/google-gdk-license"
          touch "$BUILDOZER_SDK/licenses/android-sdk-preview-license"
          
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          echo "=== 验证SDK结构 ==="
          ls -la "$BUILDOZER_SDK/"
          ls -la "$BUILDOZER_SDK/tools/bin/" 2>/dev/null || echo "tools/bin不存在"
          ls "$BUILDOZER_SDK/tools/bin/lib/" 2>/dev/null | head -10 || echo "lib不存在"
          
          # 测试sdkmanager
          echo "=== 测试sdkmanager ==="
          if [ -f "$BUILDOZER_SDK/tools/bin/sdkmanager" ]; then
            file "$BUILDOZER_SDK/tools/bin/sdkmanager"
            "$BUILDOZER_SDK/tools/bin/sdkmanager" --version 2>&1 || echo "测试失败"
          fi

      - name: Build debug APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROIDSDKROOT=$HOME/.buildozer/android/platform/android-sdk
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          cd android
          buildozer android debug
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDSDKROOT: /home/runner/.buildozer/android/platform/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
          BUILD_NUMBER: ${{ github.run_number }}

      - name: List APK output
        run: |
          ls -la android/bin/ 2>/dev/null || echo "APK目录不存在"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/bin/*.apk
          retention-days: 30

  # ============================================
  # Windows EXE 构建
  # ============================================
  build-desktop:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd desktop
          npm install

      - name: Build Electron app
        run: |
          cd desktop
          npm run build
        shell: bash

      - name: List build output
        run: |
          if (Test-Path desktop/release) { Get-ChildItem desktop/release -Recurse } else { Write-Host "Release目录不存在" }
          if (Test-Path desktop/dist) { Get-ChildItem desktop/dist -Recurse } else { Write-Host "Dist目录不存在" }

      - name: Upload desktop installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-app
          path: |
            desktop/release/*.exe
            desktop/dist/**/*
          retention-days: 30
