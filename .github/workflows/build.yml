name: Build All Platforms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================
  # Android APK 构建
  # ============================================
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36
          pip install buildozer==1.5.0
          pip install kivy==2.3.0

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-dev build-essential git zip unzip openjdk-11-jdk
          sudo update-alternatives --set java /usr/lib/jvm/java-11-openjdk-amd64/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-11-openjdk-amd64/bin/javac
          java -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: 33.0.2
          accept-licences: true

      - name: Download Android NDK
        run: |
          NDK_VERSION="r28c"
          NDK_DIR="$HOME/.buildozer/android/platform/android-ndk-$NDK_VERSION"
          
          # 先创建目录
          mkdir -p "$HOME/.buildozer/android/platform"
          
          if [ ! -d "$NDK_DIR" ]; then
            echo "下载 Android NDK $NDK_VERSION..."
            wget -q "https://dl.google.com/android/repository/android-ndk-$NDK_VERSION-linux.zip" -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d "$HOME/.buildozer/android/platform/"
            rm /tmp/ndk.zip
          fi
          
          # 创建符号链接让buildozer找到NDK
          ln -sf "$NDK_DIR" "$HOME/.buildozer/android/platform/android-ndk"
          
          echo "=== NDK验证 ==="
          ls -la "$HOME/.buildozer/android/platform/"

      - name: Setup buildozer SDK structure
        run: |
          # 使用setup-android的SDK作为基础
          SYSTEM_SDK="/usr/local/lib/android/sdk"
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          
          mkdir -p "$BUILDOZER_SDK"
          
          # 复制/链接系统SDK组件
          ln -sf "$SYSTEM_SDK/build-tools" "$BUILDOZER_SDK/"
          ln -sf "$SYSTEM_SDK/platforms" "$BUILDOZER_SDK/"
          ln -sf "$SYSTEM_SDK/platform-tools" "$BUILDOZER_SDK/"
          ln -sf "$SYSTEM_SDK/licenses" "$BUILDOZER_SDK/"
          
          # 复制cmdline-tools（包含sdkmanager）
          if [ -d "$SYSTEM_SDK/cmdline-tools" ]; then
            cp -r "$SYSTEM_SDK/cmdline-tools" "$BUILDOZER_SDK/"
          fi
          
          # 创建buildozer期望的tools/bin目录并复制sdkmanager
          mkdir -p "$BUILDOZER_SDK/tools/bin"
          if [ -f "$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            cp "$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager" "$BUILDOZER_SDK/tools/bin/"
            cp "$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager.bat" "$BUILDOZER_SDK/tools/bin/" 2>/dev/null || true
            if [ -d "$SYSTEM_SDK/cmdline-tools/latest/bin/lib" ]; then
              cp -r "$SYSTEM_SDK/cmdline-tools/latest/bin/lib" "$BUILDOZER_SDK/tools/bin/"
            fi
            chmod +x "$BUILDOZER_SDK/tools/bin/sdkmanager"
          fi
          
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          echo "=== SDK结构验证 ==="
          ls -la "$BUILDOZER_SDK/"
          ls -la "$BUILDOZER_SDK/tools/bin/" 2>/dev/null || echo "tools/bin不存在"
          
          # 测试sdkmanager
          echo "=== 测试sdkmanager ==="
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          if [ -f "$BUILDOZER_SDK/tools/bin/sdkmanager" ]; then
            file "$BUILDOZER_SDK/tools/bin/sdkmanager"
            "$BUILDOZER_SDK/tools/bin/sdkmanager" --version 2>&1 || echo "测试失败"
          fi

      - name: Build debug APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROIDSDKROOT=/usr/local/lib/android/sdk
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          cd android
          buildozer android debug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROIDSDKROOT: /usr/local/lib/android/sdk
          JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
          BUILD_NUMBER: ${{ github.run_number }}

      - name: List APK output
        run: |
          ls -la android/bin/ 2>/dev/null || echo "APK目录不存在"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/bin/*.apk
          retention-days: 30

  # ============================================
  # Windows EXE 构建
  # ============================================
  build-desktop:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd desktop
          npm install

      - name: Build Electron app
        run: |
          cd desktop
          npm run build
        shell: bash

      - name: List build output
        run: |
          if (Test-Path desktop/release) { Get-ChildItem desktop/release -Recurse } else { Write-Host "Release目录不存在" }
          if (Test-Path desktop/dist) { Get-ChildItem desktop/dist -Recurse } else { Write-Host "Dist目录不存在" }

      - name: Upload desktop installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-app
          path: |
            desktop/release/*.exe
            desktop/dist/**/*
          retention-days: 30
