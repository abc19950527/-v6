name: Build All Platforms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================
  # Android APK 构建
  # ============================================
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36
          pip install buildozer==1.5.0
          pip install kivy==2.3.0

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-dev build-essential git zip unzip
          sudo apt install -y openjdk-11-jdk
          java -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: 33.0.2

      - name: Accept licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install NDK
        run: |
          sdkmanager "ndk;25b" 2>/dev/null || echo "NDK安装跳过"

      - name: Build debug APK
        run: |
          cd android
          buildozer android debug --verbose
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROIDSDKROOT: ${{ env.ANDROID_HOME }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: List APK output
        run: |
          ls -la android/bin/ 2>/dev/null || echo "APK目录不存在"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/bin/*.apk
          retention-days: 30

  # ============================================
  # Windows EXE 构建
  # ============================================
  build-desktop:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd desktop
          npm install

      - name: Build Electron app
        run: |
          cd desktop
          npm run build
        shell: bash

      - name: List build output
        run: |
          if (Test-Path desktop/release) { Get-ChildItem desktop/release -Recurse } else { Write-Host "Release目录不存在" }
          if (Test-Path desktop/dist) { Get-ChildItem desktop/dist -Recurse } else { Write-Host "Dist目录不存在" }

      - name: Upload desktop installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-app
          path: |
            desktop/release/*.exe
            desktop/dist/**/*
          retention-days: 30
